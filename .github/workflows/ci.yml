name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --dev
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python examples/guarded_turn.py
      - run: uv build

  robot-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y gcc libcairo2-dev libgirepository1.0-dev pkg-config python3-dev gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --dev --extra robot
      - run: uv run --extra robot python scripts/check_reachy_sdk_api.py
      - run: uv run --extra robot pytest tests/test_reachy_audio.py
      - run: uv run --extra robot pytest tests/test_reachy_motion.py

  asr-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --dev --extra asr
      - run: uv run --extra asr python -c 'import faster_whisper; print(faster_whisper.__version__)'
      - run: uv run --extra asr pytest tests/test_ingress.py
