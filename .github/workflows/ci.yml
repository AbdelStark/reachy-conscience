name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --dev
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python examples/guarded_turn.py
      - run: uv run conscience-owner-console --help
      - run: uv run conscience-voice --help
      - run: uv build
      - run: |
          uv venv "$RUNNER_TEMP/conscience-wheel"
          uv pip install --python "$RUNNER_TEMP/conscience-wheel/bin/python" --no-cache dist/*.whl
          "$RUNNER_TEMP/conscience-wheel/bin/python" -I -c 'from importlib.resources import files; from reachy_conscience import PolicyStore, Ledger, GuardAssessment, ReachyMediaAudio, OwnedVoiceSession, OwnerConsole, OwnerApprovalBroker; from reachy_conscience.redteam import redteam_cases; assert files("reachy_conscience").joinpath("assets", "index.html").is_file(); assert len(redteam_cases()) == 20; print("fresh wheel, approval broker, console and synthetic corpus ok")'
          "$RUNNER_TEMP/conscience-wheel/bin/conscience-owner-console" --help
          "$RUNNER_TEMP/conscience-wheel/bin/conscience-voice" --help

  robot-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y gcc libcairo2-dev libgirepository1.0-dev pkg-config python3-dev gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --dev --extra robot
      - run: uv run --extra robot python scripts/check_reachy_sdk_api.py
      - run: uv run --extra robot pytest tests/test_reachy_audio.py
      - run: uv run --extra robot pytest tests/test_reachy_motion.py

  jev-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --dev --extra jev
      - run: uv run --extra jev python scripts/check_typesafe_sdk_api.py
      - run: uv run --extra jev pytest tests/test_jev.py

  asr-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --dev --extra asr
      - run: uv run --extra asr python -c 'import faster_whisper; print(faster_whisper.__version__)'
      - run: uv run --extra asr pytest tests/test_ingress.py

  offline-tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: python -m pip install uv==0.9.18
      - run: uv sync --locked --dev
      - run: uv run pytest tests/test_local_tts.py tests/test_proposal_planner.py
